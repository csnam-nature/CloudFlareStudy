<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>네이처텍 문서 챗봇</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="chat">
  <header class="top">
    <h1>📄 <span id="appTitle">네이처텍 문서 챗봇</span></h1>
    <span id="mode" class="badge">확인 중…</span>
    <span id="conn" class="conn">연결 중…</span>
    <span class="spacer"></span>
    <label class="muted" for="docFilter">검색 범위</label>
    <select id="docFilter"><option value="">모든 문서</option></select>
    <select id="saveAll" title="지금까지의 대화를 파일로 저장">
      <option value="">대화 저장…</option>
      <option value="md">Markdown (.md)</option>
      <option value="docx">Word (.docx)</option>
      <option value="pdf">PDF (인쇄 → PDF로 저장)</option>
    </select>
    <button id="resetBtn" type="button" title="대화 기록을 지우고 새로 시작">새 대화</button>
    <a href="/admin.html">문서 관리</a>
  </header>

  <section id="messages">
    <div class="inner" id="list"></div>
  </section>

  <footer class="composer">
    <div class="inner">
      <form id="askForm">
        <textarea id="question" rows="1" placeholder="문서에 대해 물어보세요. 예) E-21 오류는 무엇인가요?" autofocus></textarea>
        <button id="sendBtn" class="primary" type="submit">보내기</button>
      </form>
      <div class="hint">Enter 보내기 · Shift+Enter 줄바꿈 · 답변은 등록된 문서만 근거로 만듭니다.</div>
    </div>
  </footer>
  <div id="toast" class="toast"></div>

  <template id="emptyTpl">
    <div class="empty">
      <h2>무엇이든 물어보세요</h2>
      <p>관리자가 올린 네이처텍 문서(PDF·Word·한글·엑셀·이미지 등)에서 근거를 찾아 답합니다.</p>
      <div class="examples">
        <button type="button">E-21 오류는 무엇인가요?</button>
        <button type="button">충전 시작 절차를 알려 주세요</button>
        <button type="button">등록된 문서를 요약해 주세요</button>
      </div>
    </div>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
